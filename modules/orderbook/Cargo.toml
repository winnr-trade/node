[package]
name = "orderbook"
description = "CLOB orderbook module for prediction market trading"
version.workspace = true
edition.workspace = true

[dependencies]
# Internal dependencies
shared-types = { workspace = true }
market = { workspace = true }
shielded-pool = { workspace = true }
agent-wallet = { workspace = true }

# Sovereign SDK
sov-modules-api = { workspace = true }
sov-state = { workspace = true }
sov-bank = { workspace = true }
sov-chain-state = { workspace = true }

# Serialization
borsh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
sov-address = { workspace = true, features = ["evm"] }
sov-test-utils = { workspace = true }
strum = { workspace = true }

[features]
default = ["native"]
native = [
    "sov-modules-api/native",
    "sov-state/native",
    "sov-bank/native",
    "sov-chain-state/native",
    "market/native",
    "shielded-pool/native",
    "agent-wallet/native",
]